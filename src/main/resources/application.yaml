spring:
  application:
    name: bloom
  config:

    import: "optional:classpath:application-local.yaml"

  datasource:
    url: "${bloom.db.url}"
    username: "${bloom.db.usuario}"
    password: "${bloom.db.clave}"
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /bloom

bloom:
  db:
    url: "jdbc:sqlserver://localhost:1433;databaseName=bloom;encrypt=true;trustServerCertificate=true"
    usuario: "bloom_app"
    clave: "Bloom2026*"

springdoc:
  swagger-ui:
    path: /swagger-ui.html